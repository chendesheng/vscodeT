name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (full test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev
      - name: Build
        run: zig build
      - name: Test
        run: zig build test --summary all

  macos:
    name: macOS (full test suite)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma
        run: brew install oniguruma
      - name: Build
        run: zig build
      - name: Test
        run: zig build test --summary all

  windows:
    name: Windows (full test suite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install oniguruma:x64-windows
          "ONIG_DIR=$vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        shell: pwsh
        run: zig build "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
      - name: Test
        shell: pwsh
        run: zig build test --summary all "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"

  cross-compile:
    name: Cross-compile watcher for Windows and macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Windows backend
        run: zig build check-watcher -Dwatcher-only=true -Dtarget=x86_64-windows
      - name: macOS backend
        run: zig build check-watcher -Dwatcher-only=true -Dtarget=aarch64-macos
