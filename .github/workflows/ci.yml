name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (full test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check portable cassette filenames and indexes
        run: |
          python3 -m unittest discover -s scripts/oracle -p test_cassette_files.py
          python3 scripts/oracle/generate_cassette_index.py --check
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev ripgrep
      - name: Check workbench boundaries
        run: zig build check-workbench
      - name: Build
        run: zig build
      - name: Build the JSON language server
        run: |
          cd host
          # The JSON bundle only needs esbuild's platform package, so the
          # native host dependencies do not need their install scripts.
          npm ci --ignore-scripts
          npm run build:json
      - name: Test
        run: zig build test --summary all

  macos:
    name: macOS (full test suite)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma and ripgrep
        run: brew install oniguruma ripgrep
      - name: Check workbench boundaries
        run: zig build check-workbench
      - name: Build
        run: zig build
      - name: Build the JSON language server
        run: |
          cd host
          # The JSON bundle only needs esbuild's platform package, so the
          # native host dependencies do not need their install scripts.
          npm ci --ignore-scripts
          npm run build:json
      - name: Test
        run: zig build test --summary all

  ui-stress:
    name: UI stress + report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Stress tests and report
        run: scripts/ui-stress-report.sh "$RUNNER_TEMP/ui-stress-report"
      - name: Publish report to job summary
        run: cat "$RUNNER_TEMP/ui-stress-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-stress-report
          path: ${{ runner.temp }}/ui-stress-report/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (full test suite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Install oniguruma
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install oniguruma:x64-windows
          "ONIG_DIR=$vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check workbench boundaries
        shell: pwsh
        run: zig build check-workbench "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
      - name: Build
        shell: pwsh
        run: zig build "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bundle the pinned Node extension host
        working-directory: host
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm run build
          if (!(Test-Path dist/extensionHost.mjs)) { throw "Extension host bundle missing" }
      - name: Test Windows extension-host IPC
        shell: pwsh
        run: |
          zig build test-e2e "-De2e-filter=Extensions: transport" --summary all "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
      - name: Test
        shell: pwsh
        run: zig build test --summary all "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"

  cassette-conformance:
    name: Cassette conformance (strict; known failures allowed)
    runs-on: ubuntu-latest
    # The reference cassette suite asserts every recorded cursor and selection
    # set. It is expected to expose native-engine divergences until those are
    # fixed, so this job reports failures without blocking the main CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev
      - name: Strict cassette suite
        run: zig build test-oracle
