name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }} (full test suite)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check portable cassette filenames and indexes
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/oracle -p test_cassette_files.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/oracle/generate_cassette_index.py --check
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only system dependency installation varies across the native matrix.
      - name: Install oniguruma and ripgrep (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev ripgrep
      - name: Install oniguruma and ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install oniguruma ripgrep
      - name: Install oniguruma and ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install oniguruma:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ONIG_DIR=$vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check workbench boundaries
        shell: pwsh
        run: |
          $zigOptions = @()
          if ($env:ONIG_DIR) { $zigOptions = @("-Donig-include=$(Join-Path $env:ONIG_DIR include)", "-Donig-lib=$(Join-Path $env:ONIG_DIR lib)") }
          zig build check-workbench @zigOptions
      - name: Build
        shell: pwsh
        run: |
          $zigOptions = @()
          if ($env:ONIG_DIR) { $zigOptions = @("-Donig-include=$(Join-Path $env:ONIG_DIR include)", "-Donig-lib=$(Join-Path $env:ONIG_DIR lib)") }
          zig build @zigOptions
      - name: Install Node host dependencies
        working-directory: host
        # esbuild and the optional native host packages do not need their
        # native install scripts for these interoperability tests.
        run: npm ci --ignore-scripts
      - name: Bundle the JSON language server
        working-directory: host
        run: npm run build:json
      - name: Bundle the pinned Node extension host
        working-directory: host
        run: npm run build
      - name: Bundle builtin extensions and the TypeScript SDK
        working-directory: host
        run: node build-builtin-extensions.js
      - name: Verify required integration test assets
        id: integration_assets
        working-directory: host
        shell: pwsh
        run: |
          $requiredAssets = @(
            'dist/jsonServer.mjs',
            'dist/extensionHost.mjs',
            'dist/extensions/typescript-language-features/dist/extension.js',
            'dist/extensions/typescript-language-features/package.json',
            'dist/extensions/node_modules/typescript/lib/tsserver.js',
            'dist/extensions/css-language-features/server/dist/node/cssServerMain.js',
            'dist/extensions/html-language-features/server/dist/node/htmlServerMain.js',
            'dist/extensions/emmet/dist/node/emmetNodeMain.js',
            'dist/extensions/configuration-editing/dist/configurationEditingMain.js',
            'dist/extensions/extension-editing/dist/extensionEditingMain.js',
            'dist/extensions/merge-conflict/dist/mergeConflictMain.js'
          )
          foreach ($asset in $requiredAssets) {
            if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Integration test asset missing: $asset" }
          }
      - name: Test extension-host and language-server interoperability
        timeout-minutes: 20
        shell: pwsh
        run: |
          $zigOptions = @()
          if ($env:ONIG_DIR) { $zigOptions = @("-Donig-include=$(Join-Path $env:ONIG_DIR include)", "-Donig-lib=$(Join-Path $env:ONIG_DIR lib)") }
          zig build test-e2e -De2e-progress=true --summary all @zigOptions
      - name: Test
        if: ${{ !cancelled() && steps.integration_assets.outcome == 'success' }}
        shell: pwsh
        run: |
          $zigOptions = @()
          if ($env:ONIG_DIR) { $zigOptions = @("-Donig-include=$(Join-Path $env:ONIG_DIR include)", "-Donig-lib=$(Join-Path $env:ONIG_DIR lib)") }
          zig build test --summary all @zigOptions
      - name: Preserve extension-host logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-host-logs-${{ matrix.name }}
          path: .cache-ext/**/logs/extension-host*.log
          include-hidden-files: true
          if-no-files-found: ignore

  ui-stress:
    name: UI stress + report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Stress tests and report
        run: scripts/ui-stress-report.sh "$RUNNER_TEMP/ui-stress-report"
      - name: Publish report to job summary
        run: cat "$RUNNER_TEMP/ui-stress-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-stress-report
          path: ${{ runner.temp }}/ui-stress-report/
          if-no-files-found: error
          retention-days: 14

  cassette-conformance:
    name: Helix cassette conformance
    runs-on: ubuntu-latest
    # The Helix lane replays all 207 recorded cassettes and asserts every
    # recorded field (text, mode, selection count, selections, cursors and
    # viewport scroll).
    # It is expected to stay green, so this job gates the main CI.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev
      - name: Strict Helix cassette suite
        run: zig build test-oracle-helix

  vim-cassette-conformance:
    name: Vim cassette conformance
    runs-on: ubuntu-latest
    # The Vim lane replays all 329 recorded cassettes and asserts every
    # recorded field (text, mode and cursor). It is expected to stay green,
    # so this job gates the main CI.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev
      - name: Strict Vim cassette suite
        run: zig build test-oracle-vim
