name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (full test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev ripgrep
      - name: Build
        run: zig build
      - name: Build the JSON language server
        run: |
          cd host
          # The JSON bundle only needs esbuild's platform package, so the
          # native host dependencies do not need their install scripts.
          npm ci --ignore-scripts
          npm run build:json
      - name: Test
        run: zig build test --summary all

  macos:
    name: macOS (full test suite)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install oniguruma and ripgrep
        run: brew install oniguruma ripgrep
      - name: Build
        run: zig build
      - name: Build the JSON language server
        run: |
          cd host
          # The JSON bundle only needs esbuild's platform package, so the
          # native host dependencies do not need their install scripts.
          npm ci --ignore-scripts
          npm run build:json
      - name: Test
        run: zig build test --summary all

  windows:
    name: Windows (full test suite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Install oniguruma
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install oniguruma:x64-windows
          "ONIG_DIR=$vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        shell: pwsh
        run: zig build "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
      - name: Test
        shell: pwsh
        run: zig build test --summary all "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
