name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (full test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check out VS Code syntax and theme assets
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/vscode.git ../vscode
          git -C ../vscode fetch --depth 1 origin e31c2e52f563620846caab877103f630ea361b9c
          git -C ../vscode sparse-checkout set \
            extensions/json/syntaxes \
            extensions/javascript/syntaxes \
            extensions/typescript-basics/syntaxes \
            extensions/python/syntaxes \
            extensions/rust/syntaxes \
            extensions/go/syntaxes \
            extensions/cpp/syntaxes \
            extensions/java/syntaxes \
            extensions/html/syntaxes \
            extensions/css/syntaxes \
            extensions/scss/syntaxes \
            extensions/markdown-basics/syntaxes \
            extensions/shellscript/syntaxes \
            extensions/theme-defaults/themes
          git -C ../vscode checkout --detach FETCH_HEAD
      - name: Install oniguruma
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev
      - name: Build
        run: zig build
      - name: Test
        run: zig build test --summary all

  macos:
    name: macOS (full test suite)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check out VS Code syntax and theme assets
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/vscode.git ../vscode
          git -C ../vscode fetch --depth 1 origin e31c2e52f563620846caab877103f630ea361b9c
          git -C ../vscode sparse-checkout set \
            extensions/json/syntaxes \
            extensions/javascript/syntaxes \
            extensions/typescript-basics/syntaxes \
            extensions/python/syntaxes \
            extensions/rust/syntaxes \
            extensions/go/syntaxes \
            extensions/cpp/syntaxes \
            extensions/java/syntaxes \
            extensions/html/syntaxes \
            extensions/css/syntaxes \
            extensions/scss/syntaxes \
            extensions/markdown-basics/syntaxes \
            extensions/shellscript/syntaxes \
            extensions/theme-defaults/themes
          git -C ../vscode checkout --detach FETCH_HEAD
      - name: Install oniguruma
        run: brew install oniguruma
      - name: Build
        run: zig build
      - name: Test
        run: zig build test --summary all

  windows:
    name: Windows (full test suite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check out VS Code syntax and theme assets
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/vscode.git ../vscode
          git -C ../vscode fetch --depth 1 origin e31c2e52f563620846caab877103f630ea361b9c
          git -C ../vscode sparse-checkout set extensions/json/syntaxes extensions/javascript/syntaxes extensions/typescript-basics/syntaxes extensions/python/syntaxes extensions/rust/syntaxes extensions/go/syntaxes extensions/cpp/syntaxes extensions/java/syntaxes extensions/html/syntaxes extensions/css/syntaxes extensions/scss/syntaxes extensions/markdown-basics/syntaxes extensions/shellscript/syntaxes extensions/theme-defaults/themes
          git -C ../vscode checkout --detach FETCH_HEAD
      - name: Install oniguruma
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install oniguruma:x64-windows
          "ONIG_DIR=$vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        shell: pwsh
        run: zig build "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"
      - name: Test
        shell: pwsh
        run: zig build test --summary all "-Donig-include=$env:ONIG_DIR\include" "-Donig-lib=$env:ONIG_DIR\lib"

  cross-compile:
    name: Cross-compile watcher for Windows and macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Windows backend
        run: zig build check-watcher -Dwatcher-only=true -Dtarget=x86_64-windows
      - name: macOS backend
        run: zig build check-watcher -Dwatcher-only=true -Dtarget=aarch64-macos
