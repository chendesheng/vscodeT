name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate third_party/oniguruma
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig', 'build.zig.zon', 'third_party/**', 'src/**', 'ui/**', 'textmate/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - uses: actions/cache@v4
        with:
          path: .cache-nerd-font
          key: iosevka-term-nerd-font-3.5.1
      - name: Fetch IosevkaTerm Nerd Font
        run: scripts/fetch-iosevka-nerd-font.sh "$PWD/.cache-nerd-font"
      - name: Build
        run: zig build wasm -Doptimize=ReleaseSmall -Dwasm-only=true
      - name: Smoke test
        run: node web/smoke.mjs zig-out/web/editor.wasm
      - name: Build aarch64 binary
        run: |
          zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall -Donig-static=true
      - name: Prepare unkernel demo
        run: |
          set -euo pipefail
          demo=zig-out/web/unkernel
          mkdir -p "$demo/vendor"
          cp web/unkernel/index.html web/unkernel/main.js web/unkernel/style.css "$demo/"
          cp zig-out/bin/minecode "$demo/minecode"
          cp -R zig-out/web/vendor/ghostty-web "$demo/vendor/"
          cp -R "$PWD/.cache-nerd-font" "$demo/fonts"
          npm install --prefix /tmp/unkernel-sdk --no-save --ignore-scripts unkernel@0.2.0-261123-8f039c5
          mkdir -p "$demo/vendor/unkernel"
          cp -R /tmp/unkernel-sdk/node_modules/unkernel/dist/. "$demo/vendor/unkernel/"
          UNKERNEL_CACHE_DIR=/tmp/unkernel-cache node --input-type=module -e '
            import { fetchDistro } from "/tmp/unkernel-sdk/node_modules/unkernel/dist/node.mjs";
            process.stdout.write(await fetchDistro("alpine"));
          ' > /tmp/unkernel-alpine-path
          cp "$(cat /tmp/unkernel-alpine-path)" "$demo/alpine.erofs"
          ls -lh "$demo"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
