name: aarch64 musl build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: aarch64 musl binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize upstream submodules
        run: git submodule update --init --depth 1 vscode vscode-textmate third_party/oniguruma
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build minecode
        run: |
          zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall -Donig-static=true
      - name: Inspect binary
        run: |
          file zig-out/bin/minecode
          readelf -h zig-out/bin/minecode | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: minecode-aarch64-musl
          path: zig-out/bin/minecode
          if-no-files-found: error
