name: aarch64 musl build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: aarch64 musl binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build Oniguruma for aarch64 musl
        run: scripts/build-onig-aarch64.sh "$PWD/aarch64-onig"
      - name: Build vscodeT
        run: |
          zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall \
            -Donig-include="$PWD/third_party/oniguruma/src" \
            -Donig-lib="$PWD/aarch64-onig"
      - name: Inspect binary
        run: |
          file zig-out/bin/zig
          readelf -h zig-out/bin/zig | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: vscodet-aarch64-musl
          path: zig-out/bin/zig
          if-no-files-found: error
